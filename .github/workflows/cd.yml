name: CD

# Builds the production image and publishes it to GitHub Container Registry
# once CI has passed on master. Deployment itself is left to whatever pulls
# the image (add a deploy job below once a target exists).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# Serialize publishes so an older run can't overwrite `latest` after a newer one.
concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish-image:
    permissions:
      contents: read
      packages: write
    # Only publish images built from trusted pushes to this repo. `branches`
    # matches the head branch *name*, so a fork PR from a branch called
    # `master` would otherwise reach this job with packages: write.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Production image: runtime deps only (no test libs).
          build-args: REQUIREMENTS=requirements/base.txt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cd-prod
          cache-to: type=gha,mode=max,scope=cd-prod
