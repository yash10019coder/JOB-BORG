<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>

      <!--
        Reproduces the real Greenhouse pattern this fix targets: a required
        aria-labelledby-only combobox (no <label>) whose emptiness keeps the
        native Submit button disabled client-side. Confirmed live that a
        click on a disabled Submit is a silent no-op, previously
        misclassified as the opaque "No post-submit success signal found".
      -->
      <div class="field">
        <div id="eligible-label">Are you eligible to work in this location?</div>
        <input
          type="text"
          id="eligible"
          role="combobox"
          aria-labelledby="eligible-label"
          aria-required="true"
          aria-invalid="true"
          autocomplete="off"
        >
        <ul id="eligible-listbox" role="listbox" hidden></ul>
      </div>

      <button type="submit" id="submit-btn" disabled>Submit Application</button>
    </form>
  </main>
  <script>
    function initCombobox(inputId, listboxId, options) {
      var input = document.getElementById(inputId);
      var listbox = document.getElementById(listboxId);

      function render(filterText) {
        listbox.innerHTML = '';
        var term = (filterText || '').toLowerCase();
        options
          .filter(function (o) { return o.toLowerCase().indexOf(term) !== -1; })
          .forEach(function (o) {
            var li = document.createElement('li');
            li.setAttribute('role', 'option');
            li.textContent = o;
            li.addEventListener('click', function () {
              input.setAttribute('aria-invalid', 'false');
              input.dataset.value = o;
              listbox.hidden = true;
              refreshSubmitState();
            });
            listbox.appendChild(li);
          });
      }

      input.addEventListener('click', function () {
        listbox.hidden = false;
        render(input.value);
      });
      input.addEventListener('input', function () {
        listbox.hidden = false;
        render(input.value);
      });
    }

    function refreshSubmitState() {
      var firstName = document.getElementById('first_name').value.trim();
      var eligible = document.getElementById('eligible');
      var eligibleValid = eligible.getAttribute('aria-invalid') === 'false';
      document.getElementById('submit-btn').disabled = !(firstName && eligibleValid);
    }

    initCombobox('eligible', 'eligible-listbox', ['Yes', 'No']);
    document.getElementById('first_name').addEventListener('input', refreshSubmitState);

    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML =
        '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
    });
  </script>
</body>
</html>
