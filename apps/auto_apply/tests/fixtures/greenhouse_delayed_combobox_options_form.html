<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>

      <!--
        Reproduces a live-verified Greenhouse behavior: the "Degree"
        combobox's listbox container mounts (empty) the instant the field
        opens, but its real <option> list only renders a few hundred ms
        later -- confirmed via direct timing instrumentation against
        job-boards.greenhouse.io/atomicwork/jobs/4645648008's "Degree" and
        "School" fields, which race-condition-lose their options under
        GreenhouseFormClient._extract_options()'s old
        wait-for-container-visibility-only logic. The delay here is set
        well above that live-measured delay so the fixture reliably
        reproduces the race under test-environment timing too.
      -->
      <div class="field">
        <label id="degree-label" for="degree">Degree</label>
        <input
          type="text"
          id="degree"
          role="combobox"
          aria-labelledby="degree-label"
          autocomplete="off"
        >
        <ul id="degree-listbox" role="listbox" hidden></ul>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    // Empty-container-first, options-render-later combobox: click opens an
    // empty <ul role="listbox"> immediately; the real <option> entries are
    // appended only after a delay, mirroring the live Greenhouse race.
    function initDelayedCombobox(inputId, listboxId, options, delayMs) {
      var input = document.getElementById(inputId);
      var listbox = document.getElementById(listboxId);

      function renderOptions() {
        options.forEach(function (o) {
          var li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.textContent = o;
          li.addEventListener('click', function () {
            input.setAttribute('aria-invalid', 'false');
            input.dataset.value = o;
            listbox.hidden = true;
          });
          listbox.appendChild(li);
        });
      }

      input.addEventListener('click', function () {
        listbox.innerHTML = '';
        listbox.hidden = false;
        setTimeout(renderOptions, delayMs);
      });
    }

    initDelayedCombobox(
      'degree', 'degree-listbox',
      ["Associate's Degree", "Bachelor's Degree", "Master's Degree", 'Other'],
      1500
    );

    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML =
        '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
    });
  </script>
</body>
</html>
