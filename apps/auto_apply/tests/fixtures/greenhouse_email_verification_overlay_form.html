<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main id="app-root">
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="email">Email</label> <span aria-hidden="true">*</span>
        <input type="email" id="email" name="email" required aria-required="true">
      </div>
      <div class="field">
        <label for="resume">Resume/CV</label> <span aria-hidden="true">*</span>
        <input type="file" id="resume" name="resume" required aria-required="true">
      </div>
      <!--
        Reproduces a real production failure: the verification interstitial
        renders as an overlay/modal ON TOP of the original form (the
        "Submit Application" button below stays in the DOM, unlike the
        multibox fixture's full-content-replacement pattern) -- clicking it
        instead of the interstitial's own "Verify" button does nothing to
        submit the code, leaving the page stuck on the interstitial
        forever with no success signal ever appearing.
      -->
      <button type="submit">Submit Application</button>
    </form>
    <div id="verification-overlay" hidden>
      <h2>Verify your email</h2>
      <p>We sent a verification code to your email. Enter it below.</p>
      <form id="verification-form">
        <input type="text" id="otp" inputmode="numeric" autocomplete="off">
        <button type="submit">Verify</button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('verification-overlay').hidden = false;
      document.getElementById('verification-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var entered = document.getElementById('otp').value;
        if (entered === '654321') {
          document.getElementById('app-root').innerHTML =
            '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
        } else {
          document.getElementById('app-root').innerHTML =
            '<p>Invalid code, please try again.</p>' + document.getElementById('app-root').innerHTML;
        }
      });
    });
  </script>
</body>
</html>
