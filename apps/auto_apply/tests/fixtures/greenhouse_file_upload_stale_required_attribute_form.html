<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>

      <!--
        Reproduces a real production failure: Greenhouse's file-upload
        widget's underlying <input type=file> carries aria-required="true"
        even though this field (Cover Letter) is optional -- the group's own
        visible label has no required asterisk, which is the true signal a
        human filling the form relies on. Verified live: this stale/incorrect
        attribute caused `_fill_answers()` to attempt uploading a blank
        Cover Letter answer and crash with "File '' for field 'Cover Letter'
        does not exist" instead of skipping it as the optional field it is.
      -->
      <div class="field" role="group" aria-labelledby="upload-label-cover_letter">
        <div id="upload-label-cover_letter">Cover Letter</div>
        <label class="visually-hidden" for="cover_letter">Attach</label>
        <input type="file" id="cover_letter" aria-labelledby="upload-label-cover_letter" aria-required="true">
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML = '<div id="confirmation">Thanks for applying to Acme Corp!</div>';
    });
  </script>
</body>
</html>
