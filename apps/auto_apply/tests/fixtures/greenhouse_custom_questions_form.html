<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="last_name">Last Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="last_name" name="last_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="email">Email</label> <span aria-hidden="true">*</span>
        <input type="email" id="email" name="email" required aria-required="true">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="resume">Resume/CV</label> <span aria-hidden="true">*</span>
        <input type="file" id="resume" name="resume" required aria-required="true">
      </div>
      <div class="field">
        <label for="why_us">Why do you want to work here?</label> <span aria-hidden="true">*</span>
        <textarea id="why_us" name="why_us" required aria-required="true"></textarea>
      </div>
      <div class="field">
        <label for="work_auth">Are you legally authorized to work in the US?</label> <span aria-hidden="true">*</span>
        <select id="work_auth" name="work_auth" required aria-required="true">
          <option value="">Select...</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="field">
        <label for="tech_stack">Which of the following technologies have you used professionally?</label>
        <select id="tech_stack" name="tech_stack" multiple>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
        </select>
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML =
        '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
    });
  </script>
</body>
</html>
