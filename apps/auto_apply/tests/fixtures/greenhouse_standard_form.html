<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="last_name">Last Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="last_name" name="last_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="email">Email</label> <span aria-hidden="true">*</span>
        <input type="email" id="email" name="email" required aria-required="true">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="resume">Resume/CV</label> <span aria-hidden="true">*</span>
        <input type="file" id="resume" name="resume" required aria-required="true">
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML =
        '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
    });
  </script>
</body>
</html>
