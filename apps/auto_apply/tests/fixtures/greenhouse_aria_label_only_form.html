<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>

      <!--
        A control with aria-label directly on it, but no <label> element
        and no aria-labelledby. This is a valid accessibility pattern that
        some ATS platforms might use. Currently not discovered by either
        the main loop (which looks for <label> elements) or the
        aria_labelledby_only pass (which looks for aria-labelledby).
      -->
      <div class="field">
        <input
          type="text"
          id="email"
          name="email"
          aria-label="Email Address"
          required
          aria-required="true"
        >
      </div>

      <!--
        Another example: a combobox with direct aria-label only.
      -->
      <div class="field">
        <input
          type="text"
          id="country"
          role="combobox"
          aria-label="Country of Residence"
          aria-invalid="false"
          autocomplete="off"
        >
        <ul id="country-listbox" role="listbox" hidden></ul>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    function initCombobox(inputId, listboxId, options) {
      var input = document.getElementById(inputId);
      var listbox = document.getElementById(listboxId);

      function render(filterText) {
        listbox.innerHTML = '';
        var term = (filterText || '').toLowerCase();
        options
          .filter(function (o) { return o.toLowerCase().indexOf(term) !== -1; })
          .forEach(function (o) {
            var li = document.createElement('li');
            li.setAttribute('role', 'option');
            li.textContent = o;
            li.addEventListener('click', function () {
              input.setAttribute('aria-invalid', 'false');
              input.dataset.value = o;
              listbox.hidden = true;
            });
            listbox.appendChild(li);
          });
      }

      input.addEventListener('click', function () {
        listbox.hidden = false;
        render(input.value);
      });
      input.addEventListener('input', function () {
        listbox.hidden = false;
        render(input.value);
      });
    }

    initCombobox('country', 'country-listbox', ['United States', 'Canada', 'Mexico']);

    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML =
        '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
    });
  </script>
</body>
</html>
