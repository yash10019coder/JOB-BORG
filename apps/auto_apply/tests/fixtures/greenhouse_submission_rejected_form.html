<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name <span aria-hidden="true">*</span></label>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" required aria-required="true">
      </div>
      <div class="field">
        <label for="resume">Resume/CV <span aria-hidden="true">*</span></label>
        <input type="file" id="resume" name="resume" required aria-required="true">
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    // Simulates Greenhouse rejecting the submission server-side without
    // ever rendering a success signal (e.g. a validation error the client
    // didn't anticipate) -- the client must not confuse "no error thrown"
    // with "confirmed success".
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.createElement('div');
      err.setAttribute('role', 'alert');
      err.textContent = 'Something went wrong. Please try again.';
      document.body.appendChild(err);
    });
  </script>
</body>
</html>
