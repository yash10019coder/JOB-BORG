<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main id="app-root">
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>
      <div class="field">
        <label for="email">Email</label> <span aria-hidden="true">*</span>
        <input type="email" id="email" name="email" required aria-required="true">
      </div>
      <div class="field">
        <label for="resume">Resume/CV</label> <span aria-hidden="true">*</span>
        <input type="file" id="resume" name="resume" required aria-required="true">
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    // Regression guard for the classifier's tie-break rule: this success
    // page's copy deliberately overlaps a verification phrase ("check your
    // email") AND renders a stray numeric-shaped input elsewhere on the
    // page (a reference number, matching inputmode="numeric") -- both of
    // the interstitial classifier's two signals are technically present.
    // Success must still win, because it's checked first every pass.
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('app-root').innerHTML =
        '<div role="status">Thanks for applying! Your application was ' +
        'submitted successfully.</div>' +
        '<p>Check your email for next steps.</p>' +
        '<p>Reference number: ' +
        '<input type="text" inputmode="numeric" value="482913" readonly></p>';
    });
  </script>
</body>
</html>
