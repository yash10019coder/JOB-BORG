<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply to Acme Corp</title></head>
<body>
  <main>
    <h1>Apply for Senior Backend Engineer</h1>
    <form id="application-form">
      <div class="field">
        <label for="first_name">First Name</label> <span aria-hidden="true">*</span>
        <input type="text" id="first_name" name="first_name" required aria-required="true">
      </div>

      <!--
        A small, synchronous, non-paginated combobox at Greenhouse's
        standard Education-block control_id shape ("school--0") -- used to
        verify that when the education API is available, its complete
        list REPLACES this small DOM-scraped sample rather than being
        merged with or ignored in favor of it.
      -->
      <div class="field">
        <label id="school-label" for="school--0">School</label>
        <input
          type="text"
          id="school--0"
          role="combobox"
          aria-labelledby="school-label"
          autocomplete="off"
        >
        <ul id="school-listbox" role="listbox" hidden></ul>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </main>
  <script>
    function initCombobox(inputId, listboxId, options) {
      var input = document.getElementById(inputId);
      var listbox = document.getElementById(listboxId);

      input.addEventListener('click', function () {
        listbox.innerHTML = '';
        options.forEach(function (o) {
          var li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.textContent = o;
          listbox.appendChild(li);
        });
        listbox.hidden = false;
      });
    }

    initCombobox('school--0', 'school-listbox', ['DOM Sample School A', 'DOM Sample School B']);

    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML =
        '<div role="status">Thanks for applying! Your application was submitted successfully.</div>';
    });
  </script>
</body>
</html>
