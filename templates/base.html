<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}JobBorg{% endblock %}</title>
    {% load static %}
    <style>
        body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: .75rem; margin-bottom: 1.5rem; }
        nav .brand { font-weight: 700; font-size: 1.1rem; }
        nav .spacer { flex: 1; }
        .card { border: 1px solid #e2e2e2; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
        .tag { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 12px; padding: .1rem .6rem; font-size: .8rem; margin: .1rem .2rem .1rem 0; }
        .muted { color: #666; font-size: .9rem; }
        button, .btn { cursor: pointer; border: 1px solid #ccc; background: #f7f7f7; border-radius: 6px; padding: .35rem .7rem; font-size: .9rem; }
        form.actions { display: inline; }
        label { display: block; margin-top: .75rem; font-weight: 600; }
        input[type=text], input[type=number], input[type=search], select, textarea { width: 100%; padding: .4rem; margin-top: .2rem; box-sizing: border-box; }
        .errorlist { color: #b00020; list-style: none; padding: 0; }
        .score { font-weight: 700; }

        /* Modal dialog styles */
        dialog { border-radius: 8px; border: 1px solid #e2e2e2; max-width: 90vw; max-height: 85vh; overflow: auto; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
        dialog::backdrop { background: rgba(0,0,0,.4); }
        dialog button[data-modal-close] { float: right; background: transparent; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: #666; padding: 0 .5rem; }
        dialog button[data-modal-close]:hover { color: #111; }

        /* Salary region tabs */
        .salary-region-tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin: .75rem 0; padding-bottom: .5rem; border-bottom: 1px solid #e5e7eb; }
        .salary-region-tabs button[role="tab"] { background: #f7f7f7; border: 1px solid #ccc; border-radius: 6px; padding: .3rem .6rem; font-size: .8rem; cursor: pointer; transition: all .15s; }
        .salary-region-tabs button[role="tab"][aria-selected="true"] { background: #1a1a1a; color: #fff; border-color: #1a1a1a; font-weight: 600; }
        .salary-region-tabs button[role="tab"]:hover:not([aria-selected="true"]) { background: #eef2ff; border-color: #3730a3; color: #3730a3; }
    </style>
    <script src="{% static 'web/js/infinite_scroll.js' %}" defer></script>
    <script src="{% static 'web/js/modal.js' %}" defer></script>
</head>
<body>
    <nav>
        <span class="brand">JobBorg</span>
        {% if user.is_authenticated %}
            <a href="{% url 'recommendations' %}">Recommendations</a>
            <a href="{% url 'auto_apply_queue' %}">Auto-apply queue{% if auto_apply_pending_count %} <span class="tag" title="Drafted applications waiting to be sent before their job postings close">{{ auto_apply_pending_count }}</span>{% endif %}</a>
            <a href="{% url 'profile' %}">Profile</a>
            <span class="spacer"></span>
            <span class="muted">{{ user.username }}</span>
            <form class="actions" method="post" action="{% url 'logout' %}">
                {% csrf_token %}<button type="submit">Log out</button>
            </form>
        {% else %}
            <span class="spacer"></span>
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
